<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">macOS Agent Bridge — Native Mac tools for your AI workflow</title>
  <desc id="desc">Tinycast, Raycast and MCP clients share one execution engine. Bridge manages capabilities, approvals and file scope; a Swift helper connects native macOS APIs.</desc>
